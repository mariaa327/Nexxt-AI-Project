# ---------------------------------------------------------------------------
# Docker Compose for local development.
#
# Copy the root .env.example to .env first; Compose reads that file for the
# variable interpolation below. The "db" service is PostgreSQL holding the
# directory database and one database per fictional client.
# ---------------------------------------------------------------------------

services:
  db:
    image: postgres:17-alpine
    environment:
      # Development-only credentials for the local demo database.
      POSTGRES_USER: ${POSTGRES_USER:-bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bank}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bank-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bank} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Inside Compose the server is reachable as "db", not localhost.
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER:-bank}:${POSTGRES_PASSWORD:-bank}@db:5432/postgres
      SESSION_SECRET: ${SESSION_SECRET:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-west-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.anthropic.claude-sonnet-5-5}
      DEMO_TODAY: ${DEMO_TODAY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Public value baked into the client bundle at build time. The API URL
        # is the one the *browser* uses, so it must be reachable from the host.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bank-data:
